# The architecture model of go-rae-archcheck, which the checker also checks.
version: 1
module: github.com/OpenRAE/go-rae-archcheck

system:
  id: archcheck
  name: go-rae-archcheck
  description: Checks a Go module against its architecture model and its design records.

people:
  - id: developer
    name: Developer
    description: Runs the checker on a Go module, on a workstation or in CI.

external_systems:
  - id: go-command
    name: Go command
    description: Lists the packages of the checked module for golang.org/x/tools/go/packages.

relationships:
  - from: developer
    to: checker
    description: Runs
    technology: Command line
  - from: checker
    to: go-command
    description: Loads the packages of the checked module with
    technology: go list

containers:
  - id: checker
    name: archcheck
    technology: Go
    description: The archcheck command.

layers:
  - id: command
    directory: cmd/archcheck
    description: The archcheck main package, which reads the flags and prints the findings.
    uses: [code, record, model, finding]
    external: []
  - id: code
    directory: internal/code
    description: Loads the packages of a module and checks them against a model.
    uses: [model, finding]
    external:
      - path: golang.org/x/tools/go/packages
        reason: The standard loader of Go packages with their types and test variants.
      - path: golang.org/x/mod/modfile
        reason: Reads the module path from the go.mod file.
  - id: record
    directory: internal/record
    description: Checks the design records and the record rule for structural changes.
    uses: [model, finding]
    external:
      - path: go.yaml.in/yaml/v3
        reason: Encodes model structures for the comparison of two models.
  - id: model
    directory: internal/model
    description: Reads an architecture model and checks the rules that its schema cannot express.
    uses: [schema, finding]
    external:
      - path: go.yaml.in/yaml/v3
        reason: Decodes the model with known fields only.
      - path: golang.org/x/mod/module
        reason: Validates module and import paths.
  - id: schema
    directory: schema
    description: The JSON schema of the model format and the validation of a model against it.
    uses: []
    external:
      - path: github.com/santhosh-tekuri/jsonschema/v6
        reason: A JSON Schema 2020-12 validator that generates no code, for the structure of each model.
      - path: golang.org/x/text/language
        reason: The language of the messages of the schema validator.
      - path: golang.org/x/text/message
        reason: The message printer that the schema validator uses for its messages.
  - id: finding
    directory: internal/finding
    description: The finding type that every check returns.
    uses: []
    external: []

components:
  - id: command
    containers: [checker]
    description: Reads the flags, runs the checks and prints the findings.
    packages: [github.com/OpenRAE/go-rae-archcheck/cmd/archcheck]
    depends_on: [code, record, model, finding]
  - id: code
    containers: [checker]
    description: Loads the packages of a module and checks them against a model.
    packages: [github.com/OpenRAE/go-rae-archcheck/internal/code]
    depends_on: [model, finding]
    modules: [golang.org/x/tools, golang.org/x/mod]
  - id: record
    containers: [checker]
    description: Checks the design records and the record rule for structural changes.
    packages: [github.com/OpenRAE/go-rae-archcheck/internal/record]
    depends_on: [model, finding]
    modules: [go.yaml.in/yaml/v3]
  - id: model
    containers: [checker]
    description: Reads a model and checks its semantic rules.
    packages: [github.com/OpenRAE/go-rae-archcheck/internal/model]
    depends_on: [schema, finding]
    modules: [go.yaml.in/yaml/v3, golang.org/x/mod]
  - id: schema
    containers: [checker]
    description: Validates a model against the JSON schema of the format.
    packages: [github.com/OpenRAE/go-rae-archcheck/schema]
    depends_on: []
    modules: [github.com/santhosh-tekuri/jsonschema/v6, golang.org/x/text]
  - id: finding
    containers: [checker]
    description: The finding type that every check returns.
    packages: [github.com/OpenRAE/go-rae-archcheck/internal/finding]
    depends_on: []

test_modules:
  - github.com/google/go-cmp

test_support: []

rules:
  - id: process-globals
    description: >-
      Root contexts, process exit and process arguments belong to the main
      package only.
    scope:
      layers: [code, record, model, finding]
      test_files: false
    forbid_symbols: [context.Background, context.TODO, os.Exit, os.Args]
    fix: Take the context or the arguments as a parameter from the main package.

  - id: no-process-execution
    description: >-
      The checker starts no processes itself. The packages loader runs the go
      command.
    scope:
      layers: [command, code, record, model, finding]
      test_files: true
    forbid_imports: [os/exec]
    forbid_symbols: [os.StartProcess]
    fix: Use a library, or let golang.org/x/tools/go/packages run the go command.
