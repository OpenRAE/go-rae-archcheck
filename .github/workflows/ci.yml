name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.0
          install: false
      - run: make tools
      - name: File hygiene, workflow and secret checks
        run: make hygiene
      - name: Pull request body
        if: github.event_name == 'pull_request'
        run: mise exec -- uv run --locked --no-build python scripts/check_pr_body.py
      - name: Run all checks
        env:
          # A merge group has no pull request, so it gives its base commit.
          BASE_REV: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: make ci-check
      - name: Keep the coverage profile for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            .cache/coverage.out
            .cache/python-coverage.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Holds SONAR_TOKEN, so it runs no repository commands.
  # Pull requests from other repositories get no credentials, so they skip this job.
  sonar:
    name: SonarCloud
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: .cache
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
