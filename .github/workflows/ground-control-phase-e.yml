name: Ground Control Phase E
# Carries the pull request into the run record, so a dispatch run — which has no
# `pull_requests` association — is still bound to what it finalized (issue #1671).
run-name: Ground Control Phase E for PR ${{ github.event.pull_request.number || inputs.pr }}

# Finalize the merged delivery from immutable Git evidence. The helper comes from
# the private Ground-Control release. Verify its fixed checksum before installation.
# Only the download receives the read-only release token; finalization uses the
# job token. Repository scripts never run with either token.

on:
  pull_request:
    types: [closed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to finalize (maintainer repair path)
        required: true
        type: string

concurrency:
  # Serialize per pull request so a replay cannot race itself. Never cancel: a cancelled
  # finalization leaves neither a final report nor a failure record.
  group: gc-phase-e-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  # The close gate verifies this job's own run through the Actions API before it accepts an
  # automation-authored final-report marker.
  actions: read
  # The final report and the issue close. This is the job's only write.
  issues: write

jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      # The immutable merge revision, never the pull-request head. Phase E reads requirement
      # state from the merged tree and executes none of the delivered code; `fetch-depth: 0`
      # brings every branch, so the merge commit is present on the dispatch path too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Only this step receives the read-only release token.
      - name: Download the pinned private finalizer
        working-directory: .github/ground-control
        env:
          GH_TOKEN: ${{ secrets.GROUND_CONTROL_READ_TOKEN }}
        run: |
          gh release download v1.12.1 --repo autarchy-ai/Ground-Control --pattern grndctl-1.12.1.tgz
          printf '%s  %s\n' '67ea8493b7d0dbeb097078f5ec15a91c7a8fb1efd69d30657327dc983cdf0585' grndctl-1.12.1.tgz | sha256sum --check --strict
      # The lockfile in .github/ground-control pins the archive and every dependency.
      # npm ci installs exactly that tree and runs no package scripts.
      - name: Install the locked finalizer
        working-directory: .github/ground-control
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Finalize the merged delivery
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: .github/ground-control/node_modules/.bin/grndctl finalize-merged-pr --pr "$PR"
