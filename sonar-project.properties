sonar.projectKey=OpenRAE_go-rae-archcheck
sonar.organization=raesystem

# The test inclusions move the Go and Python tests out of the sources.
# The testdata directories hold fixtures for the tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,tests/**,**/testdata/**,.cache/**,.venv/**,.gc/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,tests/**
sonar.test.exclusions=**/testdata/**,.cache/**,.venv/**

# The CI Check job writes these coverage reports with make test and make gc.
sonar.go.coverage.reportPaths=.cache/coverage.out
sonar.python.coverage.reportPaths=.cache/python-coverage.xml
sonar.sourceEncoding=UTF-8
