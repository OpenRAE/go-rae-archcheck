sonar.projectKey=OpenRAE_go-rae-archcheck
sonar.organization=raesystem

# The test inclusions move the Go tests out of the sources.
# The testdata directories hold fixtures for the tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,.cache/**,.venv/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/testdata/**,.cache/**,.venv/**

# The CI Check job writes this coverage profile with make test.
sonar.go.coverage.reportPaths=.cache/coverage.out
